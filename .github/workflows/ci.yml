name: ToolkitPro CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  php-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring
          coverage: none
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: Install dependencies and generate autoloader
        run: composer install --no-interaction --prefer-dist
      - name: Validate PHP syntax
        run: composer check
      - name: Run Tools Engine tests
        run: composer test
